name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Fm27Editor.slnx -c Release

      # Offset profiles are embedded in the exe, so each file runs on its own.
      - name: Publish
        shell: pwsh
        run: |
          $version = '0.0.0'
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          $common = '-c', 'Release', '-r', 'win-x64', '--self-contained', '-p:PublishSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:DebugType=none', "-p:Version=$version"
          dotnet publish src/Fm27Editor.App/Fm27Editor.App.csproj @common -o out/app
          dotnet publish src/Fm27Editor.Tools/Fm27Editor.Tools.csproj @common -o out/tools
          New-Item -ItemType Directory release | Out-Null
          Copy-Item out/app/Fm27Editor.exe, out/tools/Fm27Editor.Tools.exe release/
          Get-FileHash release/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Fm27Editor-win-x64
          path: release/

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.exe

      - name: Create release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = (Get-Content .github/release-notes.md -Raw).Replace('{TAG}', $env:GITHUB_REF_NAME).Replace('{SHA}', $env:GITHUB_SHA)
          Set-Content notes.md $notes
          gh release create "$env:GITHUB_REF_NAME" release/Fm27Editor.exe release/Fm27Editor.Tools.exe release/SHA256SUMS.txt `
            --title "Football Manager 27 Editor $env:GITHUB_REF_NAME" --notes-file notes.md
